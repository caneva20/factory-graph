name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FactoryGraph.slnx

      - name: Build
        run: dotnet build FactoryGraph.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FactoryGraph.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack FactoryGraph.slnx --configuration Release --no-build

      - name: Resolve package version
        id: version
        run: echo "version=$(./eng/package-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Verify package contents
        run: ./eng/verify-packages.sh artifacts/packages ${{ steps.version.outputs.version }}

      - name: Test package consumers
        run: ./eng/test-packages.sh artifacts/packages ${{ steps.version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
